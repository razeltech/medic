<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E" />
      <stop offset="50%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>

    <!-- Medical Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pulse Animation -->
    <style>
      .pulse-cross {
        transform-origin: 55px 55px;
        animation: pulse 3s ease-in-out infinite;
      }
      .wave-line {
        stroke-dasharray: 800;
        stroke-dashoffset: 800;
        animation: drawLine 4s linear infinite;
      }
      .badge-glow {
        animation: floatBadge 4s ease-in-out infinite alternate;
      }
      .shimmer-text {
        animation: shimmer 6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.06); opacity: 1; filter: drop-shadow(0 0 12px #2DD4BF); }
      }
      @keyframes drawLine {
        0% { stroke-dashoffset: 800; }
        50% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -800; }
      }
      @keyframes floatBadge {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-5px); }
      }
      @keyframes shimmer {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="24" fill="url(#bgGrad)" />

  <!-- Subtle Grid Pattern Background -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="500" y1="0" x2="500" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1100" y1="0" x2="1100" y2="420" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Animated ECG / Heartbeat Wave -->
  <path class="wave-line" d="M 0 310 L 250 310 L 280 290 L 305 350 L 335 240 L 365 370 L 395 300 L 420 310 L 750 310 L 780 290 L 805 350 L 835 240 L 865 370 L 895 300 L 920 310 L 1200 310" 
        fill="none" stroke="#2DD4BF" stroke-width="2.5" opacity="0.4" />

  <!-- Animated Glowing Logo Icon -->
  <g transform="translate(100, 100)">
    <g class="pulse-cross">
      <rect width="110" height="110" rx="28" fill="#134E4A" stroke="#2DD4BF" stroke-width="2.5" />
      <!-- White Medical Cross -->
      <path d="M 45 25 L 65 25 L 65 45 L 85 45 L 85 65 L 65 65 L 65 85 L 45 85 L 45 65 L 25 65 L 25 45 L 45 45 Z" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(240, 145)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="58" fill="#FFFFFF" letter-spacing="4">
      MEDIC
    </text>
    <text x="210" y="-8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#2DD4BF" letter-spacing="2">
      OFFLINE-FIRST PWA
    </text>
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="20" fill="#CCFBF1" class="shimmer-text">
      Family Medicine Routine &amp; Stock Guardian for Indian Households
    </text>
    <text x="0" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="15" fill="#99F6E4" opacity="0.9">
      NLEM &amp; CDSCO Healthcare Standards • Natural Aarti Voice TTS • 1-Tap WhatsApp Refill
    </text>
  </g>

  <!-- Feature Capsule Badges -->
  <g transform="translate(100, 320)">
    <g class="badge-glow">
      <!-- Badge 1: 100% Offline -->
      <g transform="translate(0, 0)">
        <rect width="170" height="42" rx="12" fill="#134E4A" stroke="#14B8A6" stroke-width="1.5" />
        <text x="85" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">100% Offline PWA</text>
      </g>

      <!-- Badge 2: NLEM Standards -->
      <g transform="translate(185, 0)">
        <rect width="185" height="42" rx="12" fill="#134E4A" stroke="#14B8A6" stroke-width="1.5" />
        <text x="92" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">112+ NLEM Medicines</text>
      </g>

      <!-- Badge 3: Voice Reading -->
      <g transform="translate(385, 0)">
        <rect width="190" height="42" rx="12" fill="#134E4A" stroke="#14B8A6" stroke-width="1.5" />
        <text x="95" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Aarti Natural Voice</text>
      </g>

      <!-- Badge 4: Multilingual -->
      <g transform="translate(590, 0)">
        <rect width="195" height="42" rx="12" fill="#134E4A" stroke="#14B8A6" stroke-width="1.5" />
        <text x="97" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">EN • Telugu • Hindi</text>
      </g>

      <!-- Badge 5: WhatsApp Refill -->
      <g transform="translate(800, 0)">
        <rect width="195" height="42" rx="12" fill="#134E4A" stroke="#14B8A6" stroke-width="1.5" />
        <text x="97" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">WhatsApp Refill</text>
      </g>
    </g>
  </g>
</svg>
