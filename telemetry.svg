<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="240"
     viewBox="0 0 1200 240">

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="telemetryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031718" />
      <stop offset="50%" stop-color="#042A2B" />
      <stop offset="100%" stop-color="#021214" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#063B38" />
      <stop offset="100%" stop-color="#022422" />
    </linearGradient>

    <!-- ECG Stroke Gradient -->
    <linearGradient id="ecgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#99F6E4" />
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="1200" height="240" rx="16" fill="url(#telemetryBg)" stroke="#0D9488" stroke-width="1.5" />

  <!-- Medical Grid Background -->
  <g stroke="#134E4A" stroke-width="0.75" opacity="0.32">
    <line x1="60" y1="0" x2="60" y2="240" />
    <line x1="120" y1="0" x2="120" y2="240" />
    <line x1="180" y1="0" x2="180" y2="240" />
    <line x1="240" y1="0" x2="240" y2="240" />
    <line x1="300" y1="0" x2="300" y2="240" stroke="#14B8A6" stroke-width="1" opacity="0.3" />
    <line x1="360" y1="0" x2="360" y2="240" />
    <line x1="420" y1="0" x2="420" y2="240" />
    <line x1="480" y1="0" x2="480" y2="240" />
    <line x1="540" y1="0" x2="540" y2="240" />
    <line x1="600" y1="0" x2="600" y2="240" stroke="#14B8A6" stroke-width="1" opacity="0.3" />
    <line x1="660" y1="0" x2="660" y2="240" />
    <line x1="720" y1="0" x2="720" y2="240" />
    <line x1="780" y1="0" x2="780" y2="240" />
    <line x1="840" y1="0" x2="840" y2="240" />
    <line x1="900" y1="0" x2="900" y2="240" stroke="#14B8A6" stroke-width="1" opacity="0.3" />
    <line x1="960" y1="0" x2="960" y2="240" />
    <line x1="1020" y1="0" x2="1020" y2="240" />
    <line x1="1080" y1="0" x2="1080" y2="240" />
    <line x1="1140" y1="0" x2="1140" y2="240" />

    <line x1="0" y1="36" x2="1200" y2="36" />
    <line x1="0" y1="76" x2="1200" y2="76" stroke="#14B8A6" stroke-width="1" opacity="0.3" />
    <line x1="0" y1="116" x2="1200" y2="116" />
    <line x1="0" y1="156" x2="1200" y2="156" stroke="#14B8A6" stroke-width="1" opacity="0.3" />
    <line x1="0" y1="196" x2="1200" y2="196" />
  </g>

  <!-- Top Status Bar -->
  <g transform="translate(32, 24)">
    <circle cx="6" cy="0" r="5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="r" values="5;6.5;5" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="4" fill="#99F6E4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" font-weight="700">VITAL TELEMETRY // LOCAL SYSTEM VERIFIED // ZERO CLOUD EMISSION</text>
    <text x="1136" y="4" text-anchor="end" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" font-weight="700">PWA COMPLIANT // NLEM 2022 // CDSCO STANDARDS</text>
  </g>

  <!-- Static Ghost ECG Wave -->
  <path d="M 0 100 L 220 100 L 235 92 L 245 100 L 260 100 L 275 70 L 290 135 L 305 50 L 325 145 L 340 92 L 355 100 L 520 100 L 535 92 L 545 100 L 560 100 L 575 70 L 590 135 L 605 50 L 625 145 L 640 92 L 655 100 L 820 100 L 835 92 L 845 100 L 860 100 L 875 70 L 890 135 L 905 50 L 925 145 L 940 92 L 955 100 L 1200 100"
        fill="none" stroke="#0D9488" stroke-width="1.5" opacity="0.3" />

  <!-- Animated Active Heartbeat Wave with SMIL -->
  <path d="M 0 100 L 220 100 L 235 92 L 245 100 L 260 100 L 275 70 L 290 135 L 305 50 L 325 145 L 340 92 L 355 100 L 520 100 L 535 92 L 545 100 L 560 100 L 575 70 L 590 135 L 605 50 L 625 145 L 640 92 L 655 100 L 820 100 L 835 92 L 845 100 L 860 100 L 875 70 L 890 135 L 905 50 L 925 145 L 940 92 L 955 100 L 1200 100"
        fill="none" stroke="url(#ecgGrad)" stroke-width="2.6" stroke-dasharray="280, 920">
    <animate attributeName="stroke-dashoffset" values="1200;-1200" dur="3.2s" repeatCount="indefinite" />
  </path>

  <!-- Bottom Telemetry Metric Cards -->
  <g transform="translate(32, 166)">
    <!-- Card 1: Persistence -->
    <rect x="0" y="0" width="265" height="52" rx="8" fill="url(#cardBg)" stroke="#115E59" stroke-width="1" />
    <text x="16" y="20" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.2" font-weight="700">PERSISTENCE</text>
    <text x="16" y="40" fill="#F0FDFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">IndexedDB (16 Stores)</text>

    <!-- Card 2: Security -->
    <rect x="285" y="0" width="265" height="52" rx="8" fill="url(#cardBg)" stroke="#115E59" stroke-width="1" />
    <text x="301" y="20" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.2" font-weight="700">AIR-GAP SECURITY</text>
    <text x="301" y="40" fill="#F0FDFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">100% Offline Capable</text>

    <!-- Card 3: Formulary -->
    <rect x="570" y="0" width="265" height="52" rx="8" fill="url(#cardBg)" stroke="#115E59" stroke-width="1" />
    <text x="586" y="20" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.2" font-weight="700">FORMULARY ENGINE</text>
    <text x="586" y="40" fill="#F0FDFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">145+ PMBJP &amp; NLEM Salts</text>

    <!-- Card 4: OCR -->
    <rect x="855" y="0" width="275" height="52" rx="8" fill="url(#cardBg)" stroke="#115E59" stroke-width="1" />
    <text x="871" y="20" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.2" font-weight="700">OPTICAL RECOGNITION</text>
    <text x="871" y="40" fill="#F0FDFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Client Tesseract.js</text>
  </g>
</svg>
