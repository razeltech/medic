<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="telemetryBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c1e" />
      <stop offset="50%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#021517" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="ecgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .grid-line {
        stroke: #134e4a;
        stroke-width: 0.75;
        opacity: 0.35;
      }
      .grid-major {
        stroke: #14b8a6;
        stroke-width: 1;
        opacity: 0.25;
      }
      .ecg-path {
        stroke: #2dd4bf;
        stroke-width: 2.2;
        fill: none;
        stroke-dasharray: 1200;
        stroke-dashoffset: 1200;
        animation: ecgSweep 3.2s linear infinite;
        filter: url(#ecgGlow);
      }
      .ecg-ghost {
        stroke: #0d9488;
        stroke-width: 1.5;
        fill: none;
        opacity: 0.3;
      }
      .blinking-dot {
        animation: blinkRate 1.6s ease-in-out infinite;
      }
      .text-title {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 1.5px;
        font-weight: 700;
      }
      .text-val {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        font-weight: 600;
      }
      @keyframes ecgSweep {
        0% { stroke-dashoffset: 1200; }
        50% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -1200; }
      }
      @keyframes blinkRate {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px #10b981); }
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="1200" height="240" rx="16" fill="url(#telemetryBg)" stroke="#0d9488" stroke-width="1.5" />

  <!-- Medical Grid Background -->
  <g>
    <!-- Minor vertical lines -->
    <line x1="60" y1="0" x2="60" y2="240" class="grid-line" />
    <line x1="120" y1="0" x2="120" y2="240" class="grid-line" />
    <line x1="180" y1="0" x2="180" y2="240" class="grid-line" />
    <line x1="240" y1="0" x2="240" y2="240" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="240" class="grid-major" />
    <line x1="360" y1="0" x2="360" y2="240" class="grid-line" />
    <line x1="420" y1="0" x2="420" y2="240" class="grid-line" />
    <line x1="480" y1="0" x2="480" y2="240" class="grid-line" />
    <line x1="540" y1="0" x2="540" y2="240" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="240" class="grid-major" />
    <line x1="660" y1="0" x2="660" y2="240" class="grid-line" />
    <line x1="720" y1="0" x2="720" y2="240" class="grid-line" />
    <line x1="780" y1="0" x2="780" y2="240" class="grid-line" />
    <line x1="840" y1="0" x2="840" y2="240" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="240" class="grid-major" />
    <line x1="960" y1="0" x2="960" y2="240" class="grid-line" />
    <line x1="1020" y1="0" x2="1020" y2="240" class="grid-line" />
    <line x1="1080" y1="0" x2="1080" y2="240" class="grid-line" />
    <line x1="1140" y1="0" x2="1140" y2="240" class="grid-line" />

    <!-- Horizontal lines -->
    <line x1="0" y1="40" x2="1200" y2="40" class="grid-line" />
    <line x1="0" y1="80" x2="1200" y2="80" class="grid-major" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="160" x2="1200" y2="160" class="grid-major" />
    <line x1="0" y1="200" x2="1200" y2="200" class="grid-line" />
  </g>

  <!-- Top Status Bar -->
  <g transform="translate(32, 28)">
    <circle cx="6" cy="6" r="5" fill="#10b981" class="blinking-dot" />
    <text x="22" y="10" fill="#99f6e4" class="text-title">VITAL TELEMETRY • LOCAL SYSTEM VERIFIED • ZERO CLOUD EMISSION</text>
    <text x="1136" y="10" text-anchor="end" fill="#5eead4" class="text-title">PWA COMPLIANT • CDSCO ALIGNED</text>
  </g>

  <!-- Dual Static Ghost ECG Wave -->
  <path class="ecg-ghost" d="M 0 110 L 220 110 L 235 102 L 245 110 L 260 110 L 275 80 L 290 145 L 305 60 L 325 155 L 340 102 L 355 110 L 520 110 L 535 102 L 545 110 L 560 110 L 575 80 L 590 145 L 605 60 L 625 155 L 640 102 L 655 110 L 820 110 L 835 102 L 845 110 L 860 110 L 875 80 L 890 145 L 905 60 L 925 155 L 940 102 L 955 110 L 1200 110" />

  <!-- Animated Active Heartbeat Wave -->
  <path class="ecg-path" d="M 0 110 L 220 110 L 235 102 L 245 110 L 260 110 L 275 80 L 290 145 L 305 60 L 325 155 L 340 102 L 355 110 L 520 110 L 535 102 L 545 110 L 560 110 L 575 80 L 590 145 L 605 60 L 625 155 L 640 102 L 655 110 L 820 110 L 835 102 L 845 110 L 860 110 L 875 80 L 890 145 L 905 60 L 925 155 L 940 102 L 955 110 L 1200 110" />

  <!-- Bottom Telemetry Chips -->
  <g transform="translate(32, 175)">
    <!-- Metric 1: Data Isolation -->
    <rect x="0" y="0" width="265" height="46" rx="8" fill="#042f2e" stroke="#115e59" stroke-width="1" />
    <text x="14" y="18" fill="#5eead4" class="text-title">PERSISTENCE</text>
    <text x="14" y="36" fill="#f0fdfa" class="text-val">IndexedDB (16 Stores)</text>

    <!-- Metric 2: Network Independence -->
    <rect x="280" y="0" width="270" height="46" rx="8" fill="#042f2e" stroke="#115e59" stroke-width="1" />
    <text x="294" y="18" fill="#5eead4" class="text-title">AIR-GAP SECURITY</text>
    <text x="294" y="36" fill="#f0fdfa" class="text-val">100% Offline Capable</text>

    <!-- Metric 3: NLEM Formulations -->
    <rect x="565" y="0" width="275" height="46" rx="8" fill="#042f2e" stroke="#115e59" stroke-width="1" />
    <text x="579" y="18" fill="#5eead4" class="text-title">FORMULARY ENGINE</text>
    <text x="579" y="36" fill="#f0fdfa" class="text-val">112+ NLEM 2022 Salts</text>

    <!-- Metric 4: OCR Engine -->
    <rect x="855" y="0" width="280" height="46" rx="8" fill="#042f2e" stroke="#115e59" stroke-width="1" />
    <text x="869" y="18" fill="#5eead4" class="text-title">OPTICAL RECOGNITION</text>
    <text x="869" y="36" fill="#f0fdfa" class="text-val">Client Tesseract.js</text>
  </g>
</svg>

