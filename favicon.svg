
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#042F2E">
        <animate attributeName="stop-color"
          values="#042F2E;#0F766E;#115E59;#042F2E"
          dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#14B8A6">
        <animate attributeName="stop-color"
          values="#14B8A6;#0D9488;#22D3EE;#14B8A6"
          dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="shine">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="iconClip">
      <rect width="32" height="32" rx="8"/>
    </clipPath>
  </defs>

  <!-- Original Background Dimensions -->
  <rect width="32" height="32" rx="8" fill="url(#bgGradient)"/>

  <!-- Moving Light -->
  <g clip-path="url(#iconClip)">
    <rect x="-12" y="0" width="8" height="32" fill="url(#shine)">
      <animate attributeName="x"
        values="-12;36"
        dur="5s"
        repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Original Medical Cross: unchanged -->
  <path d="M13 7a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v6h6a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-6v6a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-6H7a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h6V7z" fill="#FFFFFF"/>

</svg>
